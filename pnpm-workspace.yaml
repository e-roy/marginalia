# The Cloud Functions package is a workspace member so the supply-chain guards below
# apply to it too, and so there is one lockfile rather than two. Its package.json uses
# plain semver ranges (never `workspace:*`), because `firebase deploy` uploads that
# file and runs its own install in the cloud, where this workspace does not exist.
packages:
  - functions

# Supply-chain protection: refuse to install any package version published less than
# 7 days ago (value is in MINUTES — 10080 = 7 days). Malicious releases are almost
# always caught and unpublished well inside that window.
#
# pnpm 11 defaults this to 1440 (1 day); we hold longer deliberately.
# If a package genuinely needs a faster hotfix, add it to minimumReleaseAgeExclude
# with a comment explaining why.
minimumReleaseAge: 10080
minimumReleaseAgeExclude: []

# Postinstall scripts are blocked unless listed here — pnpm's other supply-chain guard.
# Both of these are Node-oriented and neither is needed for a browser bundle, so they
# stay unbuilt. Adding a package here with `true` means you have decided its install
# script is safe to execute; do not do that casually.
allowBuilds:
  '@firebase/util': false
  protobufjs: false
